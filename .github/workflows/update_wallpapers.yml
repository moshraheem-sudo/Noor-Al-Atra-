name: Daily Islamic Wallpapers Sync

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wallpapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Wallpapers Scraper & Aggregator
        run: |
          python scripts/update_wallpapers.py

      - name: Commit and Push Changes If Updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/wallpapers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(wallpapers): automated daily wallpapers sync [skip ci]" && git push)
