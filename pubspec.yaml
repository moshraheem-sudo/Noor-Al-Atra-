name: flutter_noor_alatra
description: "تطبيق نور العترة - مواقيت الصلاة وفق مركز الكفيل، القرآن الكريم، الأدعية والزيارات والصوتيات، مسبحة الزهراء، القبلة، عداد الركعات"
publish_to: 'none'
version: 5.81.0+581

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: any
  http: any
  shared_preferences: any
  audioplayers: any
  path_provider: any
  sensors_plus: ^7.1.1
  wakelock_plus: ^1.5.2
  noor_ios_bridge:
    path: packages/noor_ios_bridge
  share_plus: 10.1.4
  cached_network_image: any
  flutter_svg: any
  geolocator: 14.0.2
  url_launcher: any
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  webview_flutter: ^4.14.1
  audio_service: 0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#04140D"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/worship/
    - assets/data/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs_v09.otf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
